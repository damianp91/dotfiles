general {
    compositor_fade = true
}

background {
    monitor =
    path = ~/Imágenes/forest-4.jpg
    color = rgba(0, 0, 0, 0.0)
    blur_passes = 1
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

input-field {
    monitor =
    size = 15%, 4%
    outline_thickness = 1
    inner_color = rgba(50, 48, 47, 1.0) # no fill

    outer_color = rgba(238, 189, 53, 1.0)
    check_color = rgba(142, 192, 124, 1.0)
    fail_color = rgba(204, 36, 29, 1.0)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 18

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba(242, 229, 188, 1.0)
    font_size = 25
    font_family = JetBrainsMono Nerd Font

    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(242, 229, 188, 1.0)
    font_size = 30
    font_family = JetBrainsMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}
