general {
    compositor_fade = true
}

background {
    monitor =
    path = ~/Descargas/forest.jpg
    color = rgba(0, 0, 0, 0.0)
    blur_passes = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(235, 219, 178, 1.0)
    check_color = rgba(152, 151, 26, 1.0)
    fail_color = rgba(204, 36, 29, 1.0)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 18

    position = 0, -20
    halign = center
    valign = center
}
